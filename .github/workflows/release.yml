name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Tag must match the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          package=$(node -p "require('./package.json').version")
          if [ "$tag" != "$package" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $package"
            exit 1
          fi
          echo "publishing $package"

      - name: Refuse to republish an existing version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::error::$name@$version is already on the registry"
            exit 1
          fi

      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm test

      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # prepack runs build:lib, so the tarball is always built from this commit
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
